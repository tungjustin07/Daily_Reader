name: Weekly digest

on:
  schedule:
    - cron: '0 14 * * 1'  # Mondays 7am PT standard time (adjust to 15 for daylight saving)
  workflow_dispatch:        # run manually anytime from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # needed so the workflow can push digest.db back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg (podcast transcription)
        run: sudo apt-get install -y ffmpeg

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:         ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
        run: python digest.py

      - name: Commit updated seen DB
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digest.db
          git diff --staged --quiet && exit 0
          git commit -m "chore: update seen urls [skip ci]"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push attempt $i failed, retrying in 10s..."
            sleep 10
            git fetch origin main
            if git merge-base --is-ancestor HEAD origin/main; then
              echo "commit already on remote, treating as success"
              exit 0
            fi
          done
          echo "push failed after 3 attempts"
          exit 1
