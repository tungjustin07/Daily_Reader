name: Daily digest

on:
  schedule:
    - cron: '0 14 * * *'  # 7am PT standard time (adjust to 15 for daylight saving)
  workflow_dispatch:        # run manually anytime from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # needed so the workflow can push digest.db back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg (podcast transcription)
        run: sudo apt-get update && sudo apt-get install -y --fix-missing ffmpeg

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY:     ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:         ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
        run: python digest.py

      - name: Commit updated seen DB
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digest.db
          git diff --staged --quiet || git commit -m "chore: update seen urls [skip ci]"
          git push
